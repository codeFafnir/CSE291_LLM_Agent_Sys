[project]
name = "speedbench"
version = "0.1.0"
description = "SPEED-Bench chat runs for the CSE291 non-agentic pipeline"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyarrow",
]

[project.optional-dependencies]
prepare = [
    "datasets",
    "pandas",
]
bench = [
    "nvidia-ml-py",
    "openai",
    "prometheus-client",
    "transformers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speedbench"]
